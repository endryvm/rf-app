<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RF App · Google Drive</title>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>body{margin:0;min-height:100dvh;display:grid;place-items:center;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:#000;color:#f5f5f7;padding:20px;box-sizing:border-box}
.c{max-width:380px;text-align:center;background:#141416;border-radius:28px;padding:32px 26px}img{width:72px;height:72px;border-radius:18px}h1{font-size:22px;margin:16px 0 6px}p{color:#a1a1a6;margin:0 0 20px}
a{display:inline-block;background:#fff;color:#000;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:999px}.ok{color:#30d158}.bad{color:#ff5a52}</style></head>
<body><div class="c"><img src="icon-192.png" alt=""><h1 id="t">Conectando Google Drive…</h1><p id="m">Un momento.</p><a href="./#me">Volver a RF App</a></div>
<script>
(async () => {
  const T = document.getElementById('t'), M = document.getElementById('m');
  const fail = msg => { T.textContent = 'No se pudo conectar'; T.className = 'bad'; M.textContent = msg; };
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('error')) return fail(q.get('error') === 'access_denied' ? 'Cancelaste el permiso en Google.' : q.get('error'));
    const code = q.get('code'), st = q.get('state'), saved = sessionStorage.getItem('rf-drive-state');
    if (!code) return fail('Falta el código de Google. Vuelve a intentar desde Mi perfil.');
    if (!saved || saved !== st) return fail('La conexión expiró. Vuelve a intentar desde Mi perfil, en este mismo navegador.');
    const sb = window.supabase.createClient(RF_CFG.url, RF_CFG.key, { auth: { persistSession: true } });
    const { data } = await sb.auth.getSession(); if (!data.session) return fail('Primero entra a RF App con tu cuenta de director.');
    const { data: r, error } = await sb.functions.invoke('drive', { body: { action: 'exchange', code, redirect_uri: location.origin + location.pathname } });
    if (error || r?.error) { let m = r?.error || error.message; try { const c = await error.context.json(); m = c.error || m; } catch (_) {} return fail(m); }
    sessionStorage.removeItem('rf-drive-state'); history.replaceState(null, '', location.pathname);
    T.textContent = '¡Google Drive conectado!'; T.className = 'ok'; M.textContent = 'Las secuencias se guardan en «RF App · Secuencias» de ' + (r.email || 'tu Drive') + '. La app solo ve esa carpeta.';
  } catch (e) { fail(e.message); }
})();
</script></body></html>
