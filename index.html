<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="RF App"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RF App</title>

<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}[hidden]{display:none!important}</style></head><body>
<style>
/* RF App — cristal pulido al estilo Apple: negro y blanco, dorado y azul de acento */
:root{
  --ink:#000000;--ink2:#0A0A0B;--card:#141416;--card2:#1F1F22;--solid:#2C2C2E;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--hl:transparent;--shadow:none;--btn:#F5F5F7;--btn-ink:#000;--fg:#F5F5F7;--muted:#A1A1A6;--dim:#6E6E73;--gold:#E2C07F;--gold2:#B98C45;--gold-ink:#1A1206;--blue:#0A84FF;--info:#64A8FF;--chord:#E8C77F;--glow1:rgba(226,192,127,.14);--glow2:rgba(10,132,255,.12);color-scheme:dark;
  --ok:#30D158;--warn:#FFB340;--bad:#FF5A52;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --r:20px;--r2:14px;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--ink:#FFFFFF;--ink2:#FAFAFA;--card:#F3F3F5;--card2:#EAEAED;--solid:#FFFFFF;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--hl:transparent;--shadow:none;--btn:#111113;--btn-ink:#FFFFFF;--fg:#1D1D1F;--muted:#6E6E73;--dim:#8E8E93;--gold:#A67C35;--gold2:#8A6326;--gold-ink:#FFFBF2;--blue:#007AFF;--info:#007AFF;--chord:#9A6A1E;--glow1:rgba(201,154,71,.12);--glow2:rgba(0,122,255,.08);color-scheme:light;--ok:#1F9D49;--warn:#C27400;--bad:#D93B33}}
:root[data-theme="light"]{--ink:#FFFFFF;--ink2:#FAFAFA;--card:#F3F3F5;--card2:#EAEAED;--solid:#FFFFFF;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--hl:transparent;--shadow:none;--btn:#111113;--btn-ink:#FFFFFF;--fg:#1D1D1F;--muted:#6E6E73;--dim:#8E8E93;--gold:#A67C35;--gold2:#8A6326;--gold-ink:#FFFBF2;--blue:#007AFF;--info:#007AFF;--chord:#9A6A1E;--glow1:rgba(201,154,71,.12);--glow2:rgba(0,122,255,.08);color-scheme:light;--ok:#1F9D49;--warn:#C27400;--bad:#D93B33}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:1.15em;height:1.15em;flex:none}
.chev{transform:rotate(-90deg);color:var(--dim)}
.demo svg{width:18px;height:18px;color:var(--gold)}
button{cursor:pointer}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
@media (min-width:920px){.app{grid-template-columns:232px minmax(0,1fr)}}
/* navegación */
.rail{display:none}
@media (min-width:920px){.rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--ink2)}}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.mono{font-family:var(--num);font-weight:700;font-size:20px;line-height:1;color:var(--gold-ink);background:linear-gradient(160deg,var(--gold),var(--gold2));border-radius:9px;padding:7px 8px 5px;letter-spacing:.02em}
.brand b{font-family:var(--display);font-size:17px;display:block;line-height:1.05}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.navb{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--muted);padding:10px 12px;border-radius:12px;font-weight:600;text-align:left}
.navb svg{width:20px;height:20px;flex:none}
.navb:hover{background:var(--card);color:var(--fg)}
.navb.on{background:var(--card2);color:var(--fg)}
.navb.on svg{color:var(--gold)}
.navb .pill{margin-left:auto}
.rail .sp{flex:1}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--ink2) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
@media (min-width:920px){.tabbar{display:none}}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--dim);font-size:10.5px;font-weight:600;padding:6px 0;position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--gold)}
.tabbar .dot{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--ink2)}
/* página */
.main{min-width:0;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:920px){.main{padding:28px 40px 60px}}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,5vw,34px);line-height:1.05}
.top .sp{flex:1}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.demo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);font-size:12.5px}
.demo b{color:var(--fg)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:5px 11px;border-radius:7px;font-weight:600;font-size:12.5px;white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--card);color:var(--fg);border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--gold2)}
.btn.primary{background:linear-gradient(160deg,var(--gold),var(--gold2));color:var(--gold-ink);border-color:transparent}
.btn.ghost{background:none}
.btn.small{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.danger{color:var(--bad)}
.btn svg{width:17px;height:17px}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--fg)}
.ib svg{width:18px;height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.hint{color:var(--muted);font-size:13px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
/* próximo servicio: la pieza principal de Inicio */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--gold) 26%,transparent),transparent 55%),linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line2)}
.hero .when{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px}
@media (max-width:520px){.hero .when{grid-template-columns:auto minmax(0,1fr)}.hero .when>.btn{grid-column:1/-1;justify-self:start}.hero h2{font-size:22px}}
.cal{display:flex;flex-direction:column;align-items:center;justify-content:center;width:74px;height:82px;border-radius:16px;background:var(--ink);border:1px solid var(--line2);flex:none}
.cal small{font-family:var(--num);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.cal b{font-family:var(--num);font-size:40px;line-height:.95;font-weight:700}
.hero h2{font-size:26px;line-height:1.1}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.count{font-family:var(--num);font-size:15px;color:var(--muted);letter-spacing:.04em}
.count b{color:var(--fg);font-size:22px;font-weight:700}
.tasks{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--ink) 55%,transparent);border:1px solid var(--line)}
.task .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--card2);color:var(--gold)}
.task .ic svg{width:20px;height:20px}
.task{flex-wrap:wrap}
.task .tx{flex:1 1 170px;min-width:0}
.task .tx b{display:block;font-size:14.5px}
.task .tx small{color:var(--muted);font-size:12.5px}
.task.done .ic{color:var(--ok)}
/* listas */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.click{cursor:pointer;border-radius:12px;padding:12px 10px}
.row.click:hover{background:var(--card2)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#0E1220;background:var(--c,var(--gold))}
.av.sm{width:28px;height:28px;font-size:11px}
.keyb{font-family:var(--num);font-weight:700;font-size:17px;min-width:44px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--ink);border:1px solid var(--line2);color:var(--gold);flex:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.sechead{display:flex;align-items:center;gap:10px;margin:4px 0 -4px}
.sechead h3{font-size:17px}
.sechead .sp{flex:1}
/* setlist */
.setl .row{gap:10px}
.setl .pos{font-family:var(--num);font-size:20px;font-weight:700;color:var(--dim);width:22px;text-align:center}
.links{display:flex;gap:6px;flex-wrap:wrap}
.lk{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--fg);text-decoration:none;font-size:12.5px;font-weight:600}
.lk svg{width:15px;height:15px}
.lk.yt svg{color:#FF4E45}.lk.sp svg{color:#1ED760}
/* roles del equipo */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.role{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:13px;background:var(--card2);border:1px solid var(--line);min-width:0}
.role .tx{flex:1;min-width:0}
.role .tx b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role .tx small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.role .tx .pill{margin-top:5px}
.role.open{border-style:dashed;color:var(--muted)}
/* hoja de la canción */
.sheet-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.sheet-top .tx{flex:1;min-width:200px}
.sheet-top h1{font-size:clamp(26px,6vw,38px);line-height:1.05}
.facts{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.fact{display:flex;flex-direction:column}
.fact small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.fact b{font-family:var(--num);font-size:22px;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 0;background:var(--ink)}
.tr{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tr button{border:0;background:none;width:34px;height:34px;font-weight:700;color:var(--fg)}
.tr span{font-family:var(--num);font-weight:700;font-size:16px;min-width:64px;text-align:center;color:var(--gold)}
.chart{font-size:var(--fs,18px);line-height:1.35}
.chart .sec{margin:18px 0 6px;display:flex;align-items:center;gap:10px}
.chart .sec b{font-family:var(--num);font-size:.78em;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--gold));border:1.5px solid currentColor;border-radius:6px;padding:1px 8px}
.chart .ln{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:1.4em}
.chart .sg{display:inline-flex;flex-direction:column;white-space:pre}
.chart .wd{display:inline-flex;align-items:flex-end}
.chart.lyr .sg.sp i,.chart.lyr .wd .sg i{display:none}
.chart .sg i{font-style:normal;font-family:var(--num);font-weight:700;color:var(--chord);font-size:.92em;line-height:1.1;min-height:1.1em;padding-right:.35em}
.chart.lyr .sg i{display:none}
.chart .gap{height:.6em}
.chart.lyr .ln.onlych{display:none}
.chart.big{--fs:24px}
/* formularios */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line2);background:var(--ink2);border-radius:11px;padding:10px 12px;color:var(--fg);min-width:0}
textarea.in{min-height:220px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13.5px;line-height:1.5;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:0 12px;flex:1;min-width:0}
.search svg{width:18px;height:18px;color:var(--dim);flex:none}
.search input{border:0;background:none;outline:none;padding:11px 0;flex:1;min-width:0}
/* hoja deslizante */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;background:rgba(5,7,14,.55);backdrop-filter:blur(3px)}
@media (min-width:720px){.modal{place-items:center}}
.panel{width:min(640px,100%);max-height:min(88vh,860px);overflow:auto;background:var(--ink2);border:1px solid var(--line2);border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:720px){.panel{border-radius:22px;padding:22px}}
.panel .ph{display:flex;align-items:center;gap:10px}
.panel .ph h2{font-size:21px;flex:1}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media (min-width:920px){.toast{bottom:28px}}
/* en vivo */
.live{display:flex;flex-direction:column;gap:14px}
.livebar .info{flex:1 1 200px;min-width:0}
.livebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.rec{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 25%,transparent);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.secflow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.secflow span{flex:none;font-family:var(--num);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:6px 11px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--dim)}
.secflow span.now{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.secflow span.next{color:var(--fg);border-color:var(--gold2)}
.stage{border-radius:20px;background:#05070D;color:#F5F2EA;padding:24px 20px;min-height:280px;border:1px solid var(--line)}
.stage .chart{--fs:clamp(20px,4.6vw,30px)}
.stage .chart .sg i{color:#F4CE7E}
.stage .cur{opacity:1}.stage .ln{opacity:.38;transition:opacity .25s}.stage .ln.on{opacity:1}
.bars{display:flex;gap:6px;align-items:center}
.bars i{width:12px;height:12px;border-radius:3px;background:var(--line2)}
.bars i.on{background:var(--gold)}
@media (prefers-reduced-motion:reduce){.rec{animation:none}}

.row .tx b.wrap{white-space:normal}

.singer{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap;flex:none}
.singer.none{padding:4px 10px;color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
@media (max-width:520px){.setl .singer span:last-child{display:none}.setl .singer{padding:3px}.setl .singer.none span{display:inline}}
.tstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tchip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border-radius:12px;background:var(--card2);border:1px solid var(--line);min-width:0}
.tchip b{display:block;font-size:12.5px;line-height:1.1}.tchip small{display:block;font-size:10.5px;color:var(--muted);line-height:1.1}
.tchip.pend{border-style:dashed;opacity:.8}
button.pill{cursor:pointer}

.srow{align-items:flex-start;flex-wrap:wrap}
.srow .pos,.srow .keyb,.srow .singer{margin-top:2px}
.links.study{margin-top:7px}
.links.study .lk{padding:5px 10px}
.srow .nopb{margin-top:6px}
@media (max-width:520px){.srow .nopb{margin-left:auto}}
.lk.big{padding:9px 14px;font-size:14px}

/* mezclador de in-ears */
.tabbar{grid-template-columns:repeat(6,1fr)}
.tabbar button{font-size:10px}
/* consola: tiras verticales */
.mxtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mxtools .sp{flex:1}
.mxhint{font-size:12px;color:var(--dim)}

  background:linear-gradient(180deg,var(--desk1),var(--desk2));border:1px solid var(--line);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 6%,transparent),0 10px 30px rgba(0,0,0,.18);scrollbar-width:thin}

.strip{flex:none;width:76px;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:0 0 8px;border-radius:14px;background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--line);scroll-snap-align:start;overflow:hidden;user-select:none;-webkit-user-select:none}

.fdsc{position:absolute;left:2px;top:20px;bottom:20px;width:28px;pointer-events:none}

.fdcap{position:absolute;left:50%;margin-left:4px;bottom:calc(var(--v)*(100% - 40px));width:40px;height:40px;transform:translateX(-50%);border-radius:7px;
  background:linear-gradient(180deg,var(--capa) 0%,var(--capb) 46%,var(--capa) 54%,var(--capb) 100%);box-shadow:0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px rgba(0,0,0,.35);transition:box-shadow .15s}

/* ================= estilo plano, como las referencias ================= */
body{background:var(--ink);font-feature-settings:"cv11","ss01";letter-spacing:-.01em}
h1,h2,h3{font-weight:600;letter-spacing:-.03em}
.top h1{font-size:clamp(28px,6.4vw,34px);font-weight:600}

.num{font-feature-settings:"tnum";letter-spacing:-.02em}
/* superficies planas: sin bordes marcados, sin sombras, sin brillos */
.card,.stat,.livebar,.role,.tchip,.mxpick label,.pgx,.task{background:var(--card);border:0;box-shadow:none}
.card{border-radius:24px;padding:18px}

.demo{border:0;background:var(--card);border-radius:18px}

/* botones: píldoras planas; el principal sólido (negro de día, blanco de noche) */
.btn{border-radius:999px;background:var(--card2);border:0;box-shadow:none;font-weight:500;padding:10px 18px}
.btn:hover{filter:brightness(.97)}
.btn.small{padding:7px 14px}
.btn.primary{background:var(--btn);color:var(--btn-ink);border:0;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.danger{color:var(--bad)}
.ib{border-radius:50%;background:var(--card);border:0;box-shadow:none;width:40px;height:40px}
.pill{border-radius:999px;background:var(--card2);border:0;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
a{color:var(--blue)}
.lk{border-radius:999px;background:var(--card2);border:0;font-weight:500}

.in:focus{outline:none;border-color:var(--blue)}
.search{background:var(--card);border:0;border-radius:999px}
.field label,.fact small,.stat small{letter-spacing:0;text-transform:none;font-weight:500;font-size:13px;color:var(--muted)}

.av{font-weight:600}
/* el panel negro grande de las referencias */
.hero,.phero,.stage{--fg:#FFFFFF;--muted:#9C9CA3;--dim:#6E6E73;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.2);--solid:#3A3A3C;--gold:#E2C07F;--gold2:#B98C45;--gold-ink:#1A1206;--bad:#FF5A52;--ok:#30D158;--warn:#FFB340;--btn:#FFFFFF;--btn-ink:#000;
  color:var(--fg);background:linear-gradient(180deg,#2A2A2D 0%,#0E0E10 55%,#000 100%);border:0;border-radius:34px;box-shadow:none}

/* estadísticas: números grandes, como el saldo de las referencias */
.stat{border-radius:24px;padding:16px 18px}

/* barra de abajo: píldora negra flotante */
.tabbar{left:50%;right:auto;transform:translateX(-50%);width:min(calc(100% - 28px),460px);bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:999px;border:0;

.toast{border-radius:999px;background:#111113;color:#fff}
/* consola: panel negro como el de arriba */
:root{--desk1:#1C1C1E;--desk2:#000}

.console{border:0;border-radius:32px;box-shadow:none;--fg:#F5F5F7;--muted:#A1A1A6;--dim:#7C7C82;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);color:#F5F5F7}

.sdb{border-radius:999px}
/* programa */
.prog .pgi{border-radius:12px;background:var(--card2);border:0}
.pg::before{background:var(--card2)}
.pg.t-canciones .pgi{background:var(--btn);color:var(--btn-ink)}
.pg.t-video .pgi{color:var(--blue)}
.pg.blank .pgx{border:1.5px dashed color-mix(in srgb,var(--blue) 45%,transparent);background:transparent}
.pg.blank .pgh b{color:var(--blue)}
.pg.mine .pgx{box-shadow:inset 0 0 0 1.5px var(--gold)}
.pgx{border-radius:18px}
.att i{border-radius:7px;background:var(--card2);border:0}
.att span.on i{background:var(--fg)}
.b2 i{background:var(--card2)}
.b2 i::after{background:var(--fg)}
.b2t small{color:var(--fg)}
.phero .pcam{box-shadow:0 0 0 3px #111}
.av.xl{box-shadow:none}
.tstrip{border-top:1px solid var(--line)}
.singer,.tchip{background:var(--card2);border:0}

/* ===== menú: solo íconos; el activo se abre en píldora con su nombre ===== */
.tabbar{display:flex;justify-content:space-between;width:min(calc(100% - 28px),420px);padding:7px}
.tabbar button{flex:1 1 0;flex-direction:row;justify-content:center;gap:7px;height:48px;padding:0;font-size:13px;font-weight:600;transition:flex-grow .3s cubic-bezier(.2,.8,.2,1),background .25s,color .25s}
.tabbar button span{display:none;white-space:nowrap}
.tabbar button.on{flex-grow:2.6;background:#fff;color:#000}
.tabbar button.on svg{color:#000}
.tabbar button.on span{display:inline}
.tabbar .dot{top:9px;left:calc(50% + 6px)}
.tabbar button.on .dot{display:none}
/* ===== escenario: letras / mezcla ===== */
.seg.stg{display:flex;width:100%}
.seg.stg button{flex:1;padding:9px 10px;font-size:14px}
@media (orientation:landscape) and (max-height:540px){.mixv .seg.stg{display:none}}
/* ===== inicio ===== */
.hero{padding:22px 20px 20px;text-align:center}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hhead .eyebrow{color:#9C9CA3}
.hhead .chev{transform:rotate(-90deg);width:14px;height:14px;color:#fff}
.hero .big{font-size:clamp(64px,19vw,92px);line-height:1;font-weight:600;letter-spacing:-.06em;margin-top:14px;background:linear-gradient(180deg,#fff 35%,#9A9AA1);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .big small{font-size:.36em;letter-spacing:-.02em;font-weight:500}
.hsub{color:#C7C7CC;font-size:15px;margin-top:6px}
.qas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;color:#D1D1D6;font-size:12.5px;font-weight:500;text-decoration:none;padding:0}
.qa span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;transition:transform .15s}
.qa span svg{width:22px;height:22px}
.qa:active span{transform:scale(.93)}
.qa.hot span{background:var(--gold);border-color:transparent;color:#1A1206;box-shadow:0 8px 24px rgba(226,192,127,.35)}
.qa.hot{color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:22px;background:var(--card);border:0;color:var(--fg);text-align:left;min-width:0;cursor:pointer}
.tile .tl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.tile .tl svg{width:15px;height:15px}
.tile b{font-size:34px;line-height:1.05;font-weight:500;letter-spacing:-.05em}
.tile b small{font-size:.55em;color:var(--dim)}
.tile>small{font-size:12px;color:var(--dim)}
.tavs{display:flex;align-items:center;min-height:28px}.tavs small{font-size:12px;color:var(--dim)}
.tavs .av{box-shadow:0 0 0 2px var(--card)}
.week{padding:6px 16px}
.wk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wk:last-child{border-bottom:0}
.wk .tx{flex:1 1 150px;min-width:0}
.wk .tx b{display:block;font-weight:600;font-size:15px}
.wk .tx small{display:block;color:var(--muted);font-size:13px}
.wki{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card2);flex:none}
.wki svg{width:20px;height:20px}
.wki.ok{color:var(--ok)}.wki.warn{color:var(--warn)}.wki.gold{color:var(--gold)}.wki.blue{color:var(--blue)}
.wkr{display:flex;gap:6px;align-items:center;margin-left:auto}
.wkst{font-weight:600;font-size:15px;color:var(--fg)}
.wkst.ok{color:var(--ok);font-size:13px}

.inst{display:flex;align-items:center;gap:14px}
.inst.col{flex-direction:column;align-items:stretch}
.instt{display:flex;align-items:center;gap:14px}
.inst img{width:56px;height:56px;border-radius:14px;flex:none}
.inst .tx{flex:1;min-width:0}.inst .tx b{display:block;font-size:16px}.inst .tx small{display:block;color:var(--muted);font-size:13px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--fg);font-size:14.5px}
.kbd{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--card2);vertical-align:-6px}
.kbd svg{width:14px;height:14px}

/* ===== vidrio pulido: transparencia y desenfoque, sin biseles ===== */
:root{--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);--gline:rgba(255,255,255,.09);--blur:blur(28px) saturate(1.9)}
:root[data-theme="light"]{--ink:#ECECF1;--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.72);--gline:rgba(255,255,255,.75);--card:rgba(255,255,255,.58);--card2:rgba(118,118,128,.1)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--ink:#ECECF1;--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.72);--gline:rgba(255,255,255,.75);--card:rgba(255,255,255,.58);--card2:rgba(118,118,128,.1)}}
:root:not([data-theme="light"]){--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.08)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--card:rgba(255,255,255,.58)}}
/* luces de fondo para que el vidrio tenga algo que dejar ver */
body::after{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:
  radial-gradient(42% 32% at 88% 4%,rgba(226,192,127,.28),transparent 70%),
  radial-gradient(40% 30% at 6% 38%,rgba(10,132,255,.20),transparent 70%),
  radial-gradient(45% 30% at 80% 85%,rgba(226,192,127,.16),transparent 70%)}
:root[data-theme="light"] body::after{opacity:.9}
.card,.stat,.tile,.empty,.demo,.livebar,.role,.pgx,.mxpick label,.btn:not(.primary),.ib,.seg,.search,.in,select.in,textarea.in,.lk{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.card,.stat,.tile,.empty,.demo,.livebar,.role,.pgx{background:var(--glass);border:1px solid var(--gline)}
.tile{border:1px solid var(--gline)}
.btn:not(.primary),.ib{background:var(--glass2);border:1px solid var(--gline)}
.btn.ghost{background:var(--glass)}
.mhead{background:transparent;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;background:color-mix(in srgb,var(--ink) 55%,transparent)}
/* panel negro: vidrio ahumado */
.hero,.phero{background:radial-gradient(90% 70% at 100% 0%,rgba(226,192,127,.2),transparent 60%),linear-gradient(180deg,rgba(44,44,48,.82),rgba(6,6,8,.9));-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border:1px solid rgba(255,255,255,.08)}
.qa span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.hero .btn,.phero .btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.hero .task,.hero .cal{background:rgba(255,255,255,.08)}
/* barra de abajo: vidrio oscuro translúcido */
.tabbar{background:rgba(18,18,20,.62);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);border:1px solid rgba(255,255,255,.12)}
.tabbar button.on{background:rgba(255,255,255,.92)}
.tabbar button:not(.on){color:#A1A1A6}
/* ventanas y avisos de vidrio */
.panel{background:color-mix(in srgb,var(--ink) 72%,transparent);-webkit-backdrop-filter:blur(40px) saturate(1.9);backdrop-filter:blur(40px) saturate(1.9);border:1px solid var(--gline)}
.modal{background:rgba(0,0,0,.28)}
.toast{background:rgba(24,24,26,.7);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.rail{background:color-mix(in srgb,var(--ink2) 55%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.console{background:linear-gradient(180deg,rgba(30,30,33,.85),rgba(0,0,0,.92));-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.08)}
.seg button.on{background:var(--glass2);box-shadow:0 1px 6px rgba(0,0,0,.12)}
:root[data-theme="light"] .seg button.on{background:#fff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .seg button.on{background:#fff}}

.login{min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lcard{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;padding:26px}
.lhead{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:4px}
.lhead h1{font-size:28px}.lhead .hint{margin:0}
.logo.lg{width:76px;height:76px;border-radius:20px}
.gd{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--card2);color:var(--blue);flex:none}.gd svg{width:26px;height:26px}

/* mezcla rápida por el WiFi del sonido */
.mxnet{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:16px;background:var(--glass,var(--card));border:1px solid var(--gline,var(--line))}
.mxnet>div{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}.mxnet small{color:var(--muted);font-size:12.5px;flex:1}
.mxnet b{display:flex;align-items:center;gap:6px;font-size:14px}.mxnet b svg{width:16px;height:16px;color:var(--gold)}
.mxnet.on{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.mxauto{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);width:100%}
@media (orientation:landscape) and (max-height:520px){.mxnet:not(.on){display:none}}
.mxnet a{text-decoration:none}
.mxip{width:150px;flex:0 0 auto;padding:8px 10px;font-variant-numeric:tabular-nums}

/* teléfono: nada se sale por los lados */
html,body{overflow-x:clip;max-width:100%}
.main,.wrap{min-width:0;max-width:100%}
.top>*{min-width:0}
.top .search{flex:1 1 100%}
.top .seg{max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.top .seg::-webkit-scrollbar{display:none}
.top .seg button{flex:none}
.row,.row .tx{min-width:0}
.row .tx b,.row .tx small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

/* encabezado del teléfono: más bajito, y se esconde al bajar (vuelve al subir) */
@media (max-width:919px){
  .main{padding-top:6px}
  .mhead{margin:-6px -16px 8px;padding:calc(env(safe-area-inset-top,0px) + 2px) 16px 6px;transition:transform .25s ease,opacity .2s}
  .mhead .logo{width:28px;height:28px;border-radius:8px}
  .mhead>b{font-size:16px}
  .mhead .ib{width:34px;height:34px;min-width:34px}.mhead .ib svg{width:17px;height:17px}
  .mhead .mav .av{width:34px;height:34px;font-size:13px}
  .mhead.hide{transform:translateY(calc(-100% + env(safe-area-inset-top,0px)));opacity:0;pointer-events:none}
}

/* campanita */
.bell{position:relative}
.bell .bdg{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#FF3B30;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--ink)}
.rail .brand .bell{width:34px;height:34px}
.ntl{display:flex;flex-direction:column;gap:6px}
.nt{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--card);cursor:default}
.nt[data-ntsvc]{cursor:pointer}
.nt.new{background:color-mix(in srgb,var(--gold) 12%,var(--card));box-shadow:inset 3px 0 0 var(--gold)}
.nt .nic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--gold)}
.nt .nic svg{width:17px;height:17px}
.nt .nic.k-aviso{color:#7AA7FF}.nt .nic.k-respuesta{color:#4FC7A3}
.nt .tx{flex:1;min-width:0}.nt .tx b{display:block;font-size:14.5px;line-height:1.3}
.nt .tx p{margin:3px 0 0;color:var(--muted);font-size:13.5px;line-height:1.4;white-space:pre-line}
.nt .tx small{display:block;margin-top:4px;color:var(--dim);font-size:12px}
.nt .ib.sm{width:28px;height:28px;flex:none}.nt .ib.sm svg{width:14px;height:14px}

/* editor de cifrados */
.cbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cbar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 13px/1 var(--sans,inherit);white-space:nowrap;cursor:pointer}
.chip.sec{color:var(--muted)}
.chip.ch{font-family:var(--mono,ui-monospace,monospace);color:var(--gold);min-width:44px}
.chip:active{transform:scale(.96)}
textarea.chartin{min-height:240px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.55}
.cprev{margin-top:10px;max-height:340px;overflow:auto;border-radius:16px;padding:12px 14px;background:var(--card)}

/* ================= computadora ================= */
@media (min-width:920px){
  .tabbar{display:none!important}                /* ya está el menú de la izquierda */
  .main{padding-bottom:48px}
  .wrap{max-width:1240px}
}
/* lista y detalle lado a lado (canciones y agenda) */
.split{display:grid;grid-template-columns:minmax(340px,410px) minmax(0,1fr);gap:28px;align-items:start}
.split .wrap{max-width:none;margin:0}
.spl{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding-right:6px;scrollbar-width:thin}
.spl .top .search{flex-basis:100%}
.spl .row.sel{background:color-mix(in srgb,var(--gold) 16%,var(--card));box-shadow:inset 3px 0 0 var(--gold)}
.spl .demo{display:none}
.spr{min-width:0}
.spl-empty{min-height:50vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.spl-empty svg{width:34px;height:34px;color:var(--dim)}
/* letra en dos columnas cuando hay espacio */
@media (min-width:1180px){
  .chart:not(.big){columns:2 330px;column-gap:56px}
  .chart .sec{break-after:avoid}
  .chart .ln{break-inside:avoid}
}
.spr .sheet-top h1,.spr .top h1{font-size:clamp(28px,2.4vw,38px);line-height:1.08}

/* etiquetas */
.tgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.tgs:empty{display:none}
.tg{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);line-height:1.5}
.tg.t-rapida{background:color-mix(in srgb,#F08A6E 18%,transparent);color:#E2775A}
.tg.t-moderada{background:color-mix(in srgb,#E9C47A 22%,transparent);color:#B8892F}
.tg.t-lenta{background:color-mix(in srgb,#7AA7FF 20%,transparent);color:#5B86E0}
.chip.tagc.on{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.chip.tagc.on.auto{opacity:.65}
.cbar.wrapc{flex-wrap:wrap;overflow:visible}
.tsep{width:1px;align-self:stretch;background:var(--line2);margin:2px 4px;flex:none}
.tagbar{margin-top:-4px}
.tagbar .chip{padding:6px 12px;font-size:12.5px;font-weight:500}

/* ================= editor de canción: un espacio de trabajo, no un formulario ================= */
.chip{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 13px;line-height:1;font-size:13px}
.ebox{border:1px solid var(--line2);border-radius:18px;background:var(--card);overflow:hidden}
.etb{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.etr{display:flex;align-items:center;gap:10px;min-width:0}
.etl{flex:none;width:58px;font-size:12px;color:var(--muted)}
.etb .cbar{padding:0;flex:1;min-width:0;align-items:center}
.etb .chip{height:30px;background:var(--ink2,var(--card2));border-color:var(--line)}
.etb .chip.sec{color:var(--fg);font-weight:500}
.etb .chip.ch{color:var(--chord,var(--gold));font-weight:700;min-width:40px;padding:0 10px}
.ebody{display:grid;grid-template-columns:minmax(0,1fr)}
.ebox textarea.chartin{border:0;border-radius:0;background:transparent;box-shadow:none;min-height:clamp(260px,46vh,640px);resize:vertical;padding:16px 18px;font-size:15px;line-height:1.6;outline:none}
.ebox .cprev{margin:0;border-radius:0;background:var(--ink2,transparent);border-top:1px solid var(--line);max-height:none;padding:18px 22px;overflow:auto}
.efoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.efoot .hint{margin:0}
@media (max-width:759px){.etr{flex-direction:column;align-items:stretch;gap:4px}.etl{width:auto}.ebox{border-radius:14px}}
/* tablet y computadora: el editor ocupa la pantalla y las secciones/acordes se acomodan en filas */
@media (min-width:760px){
  .panel.xl{width:min(1320px,96vw);max-height:94vh;overflow:auto;border-radius:22px;padding:22px 26px}
  .panel.xl .sedit-f{display:grid;grid-template-columns:2fr 2fr 1fr 1fr;gap:0 12px}
  .panel.xl .sedit-f .fgrid{display:contents}
  .panel.xl .sedit-f .field{margin:0 0 12px}
  .panel.xl .sedit-f .lnk{grid-column:span 2}
  .panel.xl .sedit-f .tagf{grid-column:1/-1}
  .panel.xl .etb .cbar{flex-wrap:wrap;overflow:visible}
}
/* con espacio: escribir a la izquierda, ver a la derecha, misma altura */
@media (min-width:1000px){
  .ebody.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ebody.two .cprev{border-top:0;border-left:1px solid var(--line);height:auto}
  .ebody.two textarea.chartin{min-height:clamp(320px,56vh,760px)}
}
/* la app instalada no se acerca con doble toque */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
@media (pointer:coarse){input.in,select.in,textarea.in,.search input{font-size:16px}}

/* ===== Chord Studio ===== */
.sfind{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:0 0 12px;border-radius:14px;border:1.5px dashed var(--line);background:var(--card);color:var(--fg);cursor:pointer;font:inherit}
.sfind:hover{border-color:var(--fg)}
.sfind svg{width:22px;height:22px;flex:none}
.sfind span{display:flex;flex-direction:column;gap:2px;min-width:0}
.sfind small,.smeta small{color:var(--muted);font-size:12.5px}
.smeta:empty{display:none}
.smeta{display:flex;gap:12px;align-items:center;margin:-4px 0 12px;padding:10px;border-radius:12px;background:var(--card)}
.smeta img{width:54px;height:54px;border-radius:8px;object-fit:cover;flex:none}
.smeta span{display:flex;flex-direction:column;gap:2px;min-width:0}
.ssr{display:flex;flex-direction:column;gap:6px;max-height:56vh;overflow:auto}
.ssi{display:flex;gap:12px;align-items:center;text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;cursor:pointer}
.ssi:hover{background:var(--card)}
.ssi img,.ssi .ssc{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:var(--card)}
.ssi .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.ssi small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
/* ================= cifrado: ChordPro ([G]palabra), transposición, números y conversión desde «acordes arriba» ================= */
const NOTES_S = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_F = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NOTE_I = {C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,F:5,'E#':5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const FLAT_KEYS = new Set(['F','Bb','Eb','Ab','Db','Gb','Dm','Gm','Cm','Fm','Bbm','Ebm']);
const CHORD_RE = /^([A-G][#b]?)((?:maj|min|m|M|dim|aug|sus|add|º|°|\+|-)?[0-9]*(?:\(?[#b]?[0-9]+\)?)*(?:sus[24]?|add[0-9]+)?)(?:\/([A-G][#b]?))?$/;
const isChord = t => CHORD_RE.test(String(t).trim());
const SEC_RE = /^\s*[\[{(]?\s*(intro|verso|verse|estrofa|pre[- ]?coro|pre[- ]?chorus|coro|chorus|estribillo|puente|bridge|tag|vamp|interludio|interlude|instrumental|final|outro|ending|refr[aá]n|post[- ]?coro)\b[^\]})]*[\]})]?\s*:?\s*$/i;
function keyRootIdx(key) { const m = /^([A-G][#b]?)/.exec(key || ''); return m ? NOTE_I[m[1]] : null; }
function useFlats(key) { if (!key) return false; const k = key.replace(/maj.*$/, ''); return FLAT_KEYS.has(k) || /b/.test(k.slice(1, 2)); }
function transNote(n, semi, flats) { const i = NOTE_I[n]; if (i == null) return n; return (flats ? NOTES_F : NOTES_S)[(i + semi + 1200) % 12]; }
function transChord(ch, semi, flats) { const m = CHORD_RE.exec(ch); if (!m) return ch; return transNote(m[1], semi, flats) + (m[2] || '') + (m[3] ? '/' + transNote(m[3], semi, flats) : ''); }
function transKey(key, semi) { if (!key) return key; const m = /^([A-G][#b]?)(.*)$/.exec(key); if (!m) return key; const minor = /^m(?!aj)/.test(m[2]); const sharp = transNote(m[1], semi, false) + m[2], flat = transNote(m[1], semi, true) + m[2]; return useFlats(flat) || (minor && FLAT_KEYS.has(flat)) ? flat : sharp; }
const NUM = ['1','b2','2','b3','3','4','#4','5','b6','6','b7','7'];
function nashville(ch, key) { const m = CHORD_RE.exec(ch); const r = keyRootIdx(key); if (!m || r == null) return ch; const q = (NOTE_I[m[1]] - r + 12) % 12; let s = m[2] || ''; if (/^m(?!aj)/.test(s)) s = '-' + s.slice(1); return NUM[q] + s + (m[3] ? '/' + NUM[(NOTE_I[m[3]] - r + 12) % 12] : ''); }

/* «acordes arriba, letra abajo» (como se copia de una página) → ChordPro */
function fromChordsOver(text) {
  const L = String(text || '').replace(/\r/g, '').replace(/\t/g, '    ').split('\n'); const out = [];
  const chordLine = l => { const t = l.trim().split(/\s+/).filter(Boolean); return t.length > 0 && t.every(x => isChord(x) || /^[|/x\d%()-]+$/.test(x)); };
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (SEC_RE.test(l) && !chordLine(l)) { out.push('[' + l.trim().replace(/^[\[{(]\s*|\s*[\]})]?\s*:?\s*$/g, '').replace(/^\w/, c => c.toUpperCase()) + ']'); continue; }
    if (chordLine(l)) {
      const nx = L[i + 1];
      const pos = []; l.replace(/\S+/g, (w, at) => { pos.push([at, w]); return w; });
      if (nx != null && nx.trim() && !chordLine(nx) && !SEC_RE.test(nx)) {
        let s = nx; for (let k = pos.length - 1; k >= 0; k--) { const [at, w] = pos[k]; const p = Math.min(at, s.length); s = s.slice(0, p).padEnd(p) + '[' + w + ']' + s.slice(p); }
        out.push(s.replace(/\s+$/, '')); i++;
      } else out.push(pos.map(([, w]) => '[' + w + ']').join(' '));
      continue;
    }
    out.push(l);
  }
  return out.join('\n');
}
const looksChordsOver = t => { const L = String(t || '').split('\n'); let c = 0; L.forEach(l => { const w = l.trim().split(/\s+/).filter(Boolean); if (w.length && w.every(isChord)) c++; }); return c >= 2 && !/\[[A-G][#b]?[^\]]*\]\S/.test(t); };

/* ChordPro → bloques para pintar: [{type:'sec',name} | {type:'line',segs:[{c,t}]} | {type:'gap'}] */
function parseChart(text) {
  const out = [];
  String(text || '').replace(/\r/g, '').split('\n').forEach(raw => {
    const l = raw.replace(/\s+$/, '');
    if (!l.trim()) { if (out.length && out[out.length - 1].type !== 'gap') out.push({ type: 'gap' }); return; }
    const sh = /^\s*\[([^\]]+)\]\s*$/.exec(l); const dir = /^\s*\{\s*(?:c|comment|soc|start_of_chorus|sov|start_of_verse)\s*:?\s*([^}]*)\}\s*$/i.exec(l);
    if ((sh && !isChord(sh[1])) || dir) { out.push({ type: 'sec', name: (sh ? sh[1] : dir[1] || 'Coro').trim() }); return; }
    if (/^\s*\{[^}]*\}\s*$/.test(l)) return;
    const segs = []; let last = { c: '', t: '' }; const re = /\[([^\]]+)\]/g; let m, at = 0;
    while ((m = re.exec(l))) { last.t += l.slice(at, m.index); segs.push(last); last = { c: m[1].trim(), t: '' }; at = re.lastIndex; }
    last.t += l.slice(at); segs.push(last);
    const clean = segs.filter((s, i) => i > 0 || s.t);
    out.push({ type: 'line', segs: clean, onlyChords: clean.every(s => !s.t.trim()) });
  });
  return out;
}
const chartLyrics = text => parseChart(text).map(b => b.type === 'sec' ? `[${b.name}]` : b.type === 'gap' ? '' : b.segs.map(s => s.t).join('').replace(/\s+/g, ' ').trim()).filter((x, i, a) => !(x === '' && a[i - 1] === '')).join('\n');
const SEC_COLORS = n => { const k = String(n).toLowerCase(); return k.startsWith('coro') || k.startsWith('chorus') ? '#E9C47A' : k.startsWith('pre') ? '#4FC7A3' : k.startsWith('puente') || k.startsWith('bridge') ? '#B48BF0' : k.startsWith('verso') || k.startsWith('verse') ? '#7AA7FF' : '#9AA3C0'; };
function renderChart(text, o) {
  o = o || {}; const semi = o.semi || 0, flats = useFlats(transKey(o.key, semi)), key = transKey(o.key, semi);
  const show = c => o.nash ? nashville(transChord(c, semi, flats), key) : o.latin && typeof latinChord === 'function' ? latinChord(transChord(c, semi, flats)) : transChord(c, semi, flats);
  let html = '', li = 0;
  parseChart(text).forEach(b => {
    if (b.type === 'sec') html += `<div class="sec" style="--c:${SEC_COLORS(b.name)}"><b>${esc(b.name)}</b></div>`;
    else if (b.type === 'gap') html += '<div class="gap"></div>';
    else {
      // se agrupa por palabras: la línea solo se corta en los espacios, nunca en medio de una palabra
      const words = []; let cur = [];
      b.segs.forEach(sg => { let c = sg.c; if (c && (!sg.t || /^\s/.test(sg.t))) { cur.push({ c, t: '' }); c = ''; }
        (sg.t || '').split(/(\s+)/).forEach(pt => { if (!pt) return; if (/^\s+$/.test(pt)) { if (cur.length) words.push(cur); words.push(null); cur = []; } else { cur.push({ c, t: pt }); c = ''; } }); });
      if (cur.length) words.push(cur);
      html += `<div class="ln${b.onlyChords ? ' onlych' : ''}" data-l="${li++}">` + words.map(w => w ? `<span class="wd">${w.map(p => `<span class="sg"><i>${p.c ? esc(show(p.c)) : ''}</i>${esc(p.t || (p.c ? '\u2002' : ''))}</span>`).join('')}</span>` : '<span class="sg sp"><i></i><span>\u00a0</span></span>').join('') + '</div>';
    }
  });
  return html || '<p class="hint">Esta canción todavía no tiene letra ni cifrado.</p>';
}

/* acordes del tono (para tocarlos e insertarlos): mayor I ii iii IV V vi + V/7 · menor i III iv v VI VII */
function keyChords(key) {
  const r = keyRootIdx(key); if (r == null) return [];
  const minor = /^[A-G][#b]?m(?!aj)/.test(key), fl = useFlats(key), n = i => (fl ? NOTES_F : NOTES_S)[(r + i + 1200) % 12];
  return minor ? [n(0) + 'm', n(3), n(5) + 'm', n(7) + 'm', n(8), n(10), n(7), n(10) + '/' + n(2)]
               : [n(0), n(2) + 'm', n(4) + 'm', n(5), n(7), n(9) + 'm', n(7) + '/' + n(11), n(0) + '/' + n(4), n(5) + '/' + n(9)];
}

/* ================= datos: la misma interfaz para la demostración (en este navegador) y para Supabase (la base de todos) ================= */

const DemoDB = (() => {
  const KEY = 'rf-equipo-demo-v5'; let st = null; const subs = new Set();
  const load = () => { try { st = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { st = null; } if (!st || !st.members) st = demoSeed(); };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} subs.forEach(f => f()); };
  const clone = x => JSON.parse(JSON.stringify(x));
  return {
    mode: 'demo',
    async init() { load(); return true; },
    me() { return st.members.find(m => m.id === st.me) || st.members[0]; },
    actAs(id) { st.me = id; save(); },
    reset() { st = demoSeed(); save(); },
    async members() { return clone(st.members); },
    async saveMember(m) { if (!m.id) { m.id = uid(); m.color = m.color || COLORS[st.members.length % COLORS.length]; st.members.push(m); } else Object.assign(st.members.find(x => x.id === m.id) || {}, m); save(); return m; },
    async deleteMember(id) { st.members = st.members.filter(m => m.id !== id); st.services.forEach(s => { s.team = s.team.filter(t => t.member_id !== id); }); save(); },

}

/* ---------- etiquetas: rápida / moderada / lenta (sale sola del tempo) y las que quieran ---------- */
const TAG_TEMPO = ['Rápida', 'Moderada', 'Lenta'];
const TAG_BASE = ['Adoración', 'Celebración', 'Apertura', 'Ofrenda', 'Cierre', 'Himno', 'Navidad'];
const tempoTag = bpm => !bpm ? '' : +bpm >= 115 ? 'Rápida' : +bpm >= 85 ? 'Moderada' : 'Lenta';
function songTags(s) { const t = (s.tags || []).slice(); if (!t.some(x => TAG_TEMPO.includes(x))) { const a = tempoTag(s.bpm); if (a) t.unshift(a); } return t; }
function allTags() { const used = new Set(); ST.songs.forEach(s => songTags(s).forEach(t => used.add(t))); return [...TAG_TEMPO, ...TAG_BASE.filter(t => used.has(t)), ...[...used].filter(t => !TAG_TEMPO.includes(t) && !TAG_BASE.includes(t)).sort((a, b) => a.localeCompare(b, 'es'))]; }
const tagMatch = (s, sel) => !sel.length || sel.every(t => songTags(s).includes(t));
const tagPills = s => songTags(s).slice(0, 3).map(t => `<span class="tg${TAG_TEMPO.includes(t) ? ' t-' + t.normalize('NFD').replace(/[^a-z]/gi, '').toLowerCase() : ''}">${esc(t)}</span>`).join('');
const tagBar = (sel, attr) => `<div class="cbar tagbar" aria-label="Filtrar por etiqueta">${allTags().map(t => `<button type="button" class="chip tagc${sel.includes(t) ? ' on' : ''}" ${attr}="${esc(t)}">${esc(t)}</button>`).join('')}${sel.length ? `<button type="button" class="chip" ${attr}="">Quitar filtros</button>` : ''}</div>`;
function viewSongs() {

  return `<div class="wrap">${demoBar()}${topBar('Canciones', `${ST.songs.length} en la base de datos`, `<button class="btn primary" data-act="newsong">${ic('plus')}Canción</button>`)}

      return `<div class="row click" data-song="${s.id}"><span class="keyb">${esc(s.key || '—')}</span><div class="tx"><b>${esc(s.title)}</b><small>${esc(s.artist || '')}${s.bpm ? ' · ' + s.bpm + ' BPM' : ''}${lu ? ' · última vez ' + dShort.format(lu) : ''}</small><span class="tgs">${tagPills(s)}</span></div>${hasC ? '<span class="pill gold">Cifrado</span>' : s.chart ? '<span class="pill">Letra</span>' : ''}${s.from_playback ? '<span class="pill" title="Tiene secuencia en RF Playback">Playback</span>' : '<span class="pill warn">Falta el playback</span>'}</div>`; }).join('') : `<div class="empty">${ST.songTagF.length ? 'Ninguna canción tiene esas etiquetas juntas.' : 'No encontré canciones con ese nombre.'}</div>`}</div></div>`;

  const blocks = parseChart(so.chart);

function memberStats(id) {
  const P = past(), inS = s => s.team.some(t => t.member_id === id && t.status !== 'no');
  const ps = P.filter(inS), sung = [];
  P.forEach(s => s.songs.forEach(x => { if (x.lead_id === id) sung.push([s, x]); }));
  const bySong = {}; sung.forEach(([, x]) => { bySong[x.song_id] = (bySong[x.song_id] || 0) + 1; });
  const top = Object.entries(bySong).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const roles = {}; ps.forEach(s => s.team.filter(t => t.member_id === id && t.status !== 'no').forEach(t => { roles[t.role] = (roles[t.role] || 0) + 1; }));
  const last = P.slice(0, 12).reverse().map(s => ({ s, on: inS(s) }));
  const up = upcoming().filter(s => s.team.some(t => t.member_id === id));
  const ans = ST.services.flatMap(s => s.team.filter(t => t.member_id === id && t.status !== 'pending'));
  const okr = ans.length ? Math.round(ans.filter(t => t.status === 'ok').length / ans.length * 100) : null;
  const m = mem(id) || {}; const since = pD(m.created_at) || (ps.length ? pD(ps[ps.length - 1].date) : null);
  const prog = P.reduce((n, s) => n + (s.program || []).filter(it => it.who_id === id).length, 0);
  return { ps, sung, top, roles, last, up, okr, since, prog };
}

function photoData(file) {

    im.onload = () => { const S = 560, c = document.createElement('canvas'); c.width = c.height = S; const k = Math.min(im.naturalWidth, im.naturalHeight); c.getContext('2d').drawImage(im, (im.naturalWidth - k) / 2, (im.naturalHeight - k) / 2, k, k, 0, 0, S, S); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .82)); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('No pude abrir esa imagen.')); }; im.src = u; });
}

      <textarea class="in chartin" id="pzT" spellcheck="false" placeholder="Pega aquí el cifrado…"></textarea>
      <div class="links"><label class="sw"><input type="checkbox" id="pzRep"${ta.value.trim() ? '' : ' checked'}> Reemplazar lo que ya hay</label><span style="flex:1"></span><button class="btn primary" id="pzGo">Acomodar</button></div>`, (w2, close2) => {
      $('#pzGo', w2).onclick = () => { let v = $('#pzT', w2).value.replace(/\r/g, ''); if (!v.trim()) return toast('Pega primero el cifrado.');
        v = looksChordsOver(v) ? fromChordsOver(v) : v; v = v.replace(/\n{3,}/g, '\n\n').trim();
        ta.value = $('#pzRep', w2).checked ? v : (ta.value.trim() ? ta.value.replace(/\s+$/, '') + '\n\n' : '') + v; close2(); ta.dispatchEvent(new Event('input'));
        $('#sCh', w).textContent = 'Listo. Revisa con la vista previa que cada acorde haya quedado sobre la sílaba correcta.'; if (pv.hidden) $('#sPrevT', w).click(); };
    });
    studioBind(s, w, ta, { kc, prev, pv, tg });
    $('#sSave', w).onclick = async () => {
      const t = $('#sT', w).value.trim(); if (!t) { $('#sT', w).focus(); toast('Ponle nombre a la canción.'); return; }
      let ch = ta.value; if (looksChordsOver(ch)) ch = fromChordsOver(ch);
      Object.assign(s, { title: t, artist: $('#sA', w).value.trim(), key: $('#sK', w).value, bpm: +$('#sB', w).value || null, youtube: $('#sY', w).value.trim(), spotify: $('#sS', w).value.trim(), chart: ch, tags, meta: s.meta || null, analysis: s.analysis || null });
      if (!s.youtube && !s.spotify) toast('Recuerda agregar el enlace de la versión original para que el equipo la pueda sacar.', 4000); else if (!id) toast('Canción agregada. Queda pendiente cargar su playback en RF Playback.', 4000);
      const saved = await DB.saveSong(s); close(); await reload(); after && after(saved || s);
    };
    const d = $('[data-del]', w); if (d) d.onclick = async () => { if (d.dataset.ok) { await DB.deleteSong(id); close(); go('songs'); await reload(); } else { d.dataset.ok = 1; d.textContent = 'Toca otra vez para eliminar'; } };
  });
}
function editService(id) {
  const s = id ? ST.services.find(x => x.id === id) : { date: isoD(nextSun()), time: '10:00', name: 'Servicio dominical', rehearsal_at: '', rehearsal_place: 'Templo principal', rehearsal_notes: '', choose_by: '', notes: '' };
  modal(`${ph(id ? 'Editar servicio' : 'Nuevo servicio')}<div class="fgrid"><div class="field"><label for="vN">Nombre</label><input class="in" id="vN" value="${esc(s.name || '')}"></div><div class="field"><label for="vD">Fecha</label><input class="in" id="vD" type="date" value="${esc(s.date)}"></div><div class="field"><label for="vT">Hora</label><input class="in" id="vT" type="time" value="${esc(s.time || '')}"></div></div>
    <div class="field"><label for="vC">Elegir canciones hasta</label><input class="in" id="vC" type="date" value="${esc(s.choose_by || '')}"></div>
    <div class="sechead"><h3>Ensayo</h3></div><div class="fgrid"><div class="field"><label for="vR">Día y hora</label><input class="in" id="vR" type="datetime-local" value="${esc(s.rehearsal_at || '')}"></div><div class="field"><label for="vP">Lugar</label><input class="in" id="vP" value="${esc(s.rehearsal_place || '')}"></div></div>
    <div class="field"><label for="vRN">Qué se va a ensayar</label><input class="in" id="vRN" value="${esc(s.rehearsal_notes || '')}" placeholder="Ej.: transiciones, el final del coro…"></div>
    <div class="field"><label for="vO">Notas para el equipo</label><input class="in" id="vO" value="${esc(s.notes || '')}"></div>
    <div class="links"><span style="flex:1"></span><button class="btn primary" id="vSave">Guardar</button></div>`, (w, close) => {
    $('#vD', w).onchange = e => { if (!$('#vC', w).value) { const d = pD(e.target.value); if (d) $('#vC', w).value = isoD(addDays(d, -4)); } };
    $('#vSave', w).onclick = async () => {
      const row = Object.assign({}, id ? { id } : {}, { name: $('#vN', w).value.trim() || 'Servicio', date: $('#vD', w).value, time: $('#vT', w).value, choose_by: $('#vC', w).value, rehearsal_at: $('#vR', w).value, rehearsal_place: $('#vP', w).value.trim(), rehearsal_notes: $('#vRN', w).value.trim(), notes: $('#vO', w).value.trim() });
      if (!row.date) { toast('Elige la fecha del servicio.'); return; }
      const saved = await DB.saveService(row); close(); await reload(); if (!id && saved) { ST.tab = 'services'; ST.view = { type: 'service', id: saved.id }; render(); toast('Servicio creado. Ahora asigna al equipo.'); }
    };
  });
}
function addTeam(sid) {
  const s = ST.services.find(x => x.id === sid); let role = ROLES[1];
  modal(`${ph('Asignar al equipo')}<div class="field"><label>Rol</label><div class="links" id="tRoles">${ROLES.map(r => `<button type="button" class="pill${r === role ? ' gold' : ''}" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="tCh"> También elige las canciones de este servicio</label><div class="list" id="tList"></div>`, (w, close) => {
    const draw = () => {
      $$('#tRoles .pill', w).forEach(b => b.classList.toggle('gold', b.dataset.r === role)); $('#tCh', w).checked = VOICE(role) && role !== 'Coros';
      const busy = new Set(s.team.filter(t => t.role === role).map(t => t.member_id));
      const fits = ST.members.filter(m => (m.roles || []).includes(role)), rest = ST.members.filter(m => !(m.roles || []).includes(role));
      const row = m => { const other = upcoming().filter(x => x.id !== sid && x.date === s.date && x.team.some(t => t.member_id === m.id)).length; const recent = past().slice(0, 2).filter(x => x.team.some(t => t.member_id === m.id)).length;
        return `<div class="row click" data-m="${m.id}">${avt(m, '', '')}<div class="tx"><b>${esc(m.name)}</b><small>${esc((m.roles || []).join(' · '))}${recent ? ` · estuvo ${recent === 2 ? 'los dos últimos domingos' : 'el domingo pasado'}` : ''}</small></div>${busy.has(m.id) ? '<span class="pill ok">Ya está</span>' : other ? '<span class="pill warn">Ocupado</span>' : ''}</div>`; };
      $('#tList', w).innerHTML = (fits.length ? `<div class="eyebrow" style="margin:6px 0">Tocan o cantan ${esc(role.toLowerCase())}</div>` + fits.map(row).join('') : '') + (rest.length ? `<div class="eyebrow" style="margin:12px 0 6px">Otros</div>` + rest.map(row).join('') : '');
      $$('[data-m]', w).forEach(r => r.onclick = async () => { if (busy.has(r.dataset.m)) return; await DB.assign({ service_id: sid, member_id: r.dataset.m, role, chooses: $('#tCh', w).checked }); toast('Asignado. Le llega el aviso para confirmar.'); close(); await reload(); });
    };
    $$('#tRoles .pill', w).forEach(b => b.onclick = () => { role = b.dataset.r; draw(); }); draw();
  });
}
function editMember(id) {
  const m = id ? Object.assign({}, mem(id)) : { name: '', email: '', phone: '', roles: [], is_director: false };
  modal(`${ph(id ? 'Editar persona' : 'Invitar al equipo')}<div class="fgrid"><div class="field"><label for="mN">Nombre</label><input class="in" id="mN" value="${esc(m.name)}"></div><div class="field"><label for="mE">Correo</label><input class="in" id="mE" type="email" value="${esc(m.email || '')}" autocomplete="off"></div></div>
    <div class="field"><label>Toca o canta</label><div class="links" id="mR">${ROLES.map(r => `<button type="button" class="pill${(m.roles || []).includes(r) ? ' gold' : ''}" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>
    <div class="field"><label for="mB">Su mezcla de in-ears (bus de la X32)</label><select class="in" id="mB"><option value="0">Sin mezcla asignada</option>${Array.from({ length: 16 }, (_, i) => `<option value="${i + 1}"${+m.mix_bus === i + 1 ? ' selected' : ''}>Bus ${i + 1}</option>`).join('')}</select></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mD"${m.is_director ? ' checked' : ''}> Es director: puede armar servicios y asignar</label>
    <div class="links">${id && id !== me().id ? `<button class="btn ghost danger" data-del>${ic('trash')}Quitar del equipo</button>` : ''}<span style="flex:1"></span><button class="btn primary" id="mSave">${id ? 'Guardar' : 'Invitar'}</button></div>`, (w, close) => {
    $$('#mR .pill', w).forEach(b => b.onclick = () => b.classList.toggle('gold'));
    $('#mSave', w).onclick = async () => { const n = $('#mN', w).value.trim(), e = $('#mE', w).value.trim(); if (!n || !/.+@.+\..+/.test(e)) { toast('Pon el nombre y un correo válido.'); return; }
      Object.assign(m, { name: n, email: e, roles: $$('#mR .pill.gold', w).map(b => b.dataset.r), is_director: $('#mD', w).checked, mix_bus: +$('#mB', w).value || 0 }); await DB.saveMember(m); close(); toast(id ? 'Guardado.' : `Invitación lista: ${n} entra con su correo y le llega un código.`, 4000); await reload(); };
    const d = $('[data-del]', w); if (d) d.onclick = async () => { if (d.dataset.ok) { await DB.deleteMember(id); close(); await reload(); } else { d.dataset.ok = 1; d.textContent = 'Toca otra vez para quitar'; } };
  });
}

/* ---------- eventos de cada vista ---------- */
function bind(m) {
  const on = (sel, f) => $$(sel, m).forEach(e => e.onclick = ev => { ev.stopPropagation(); f(e, ev); });
  on('[data-as]', e => { DB.actAs(e.dataset.as); ST.sheet.mode = null; MIX.bus = 0; MIX.S = null; render(); if (ST.tab === 'mix') mixStart(); });
  on('[data-open]', e => { ST.view = { type: 'service', id: e.dataset.open }; if (ST.tab !== 'services' && ST.tab !== 'home') ST.tab = 'services'; render(); window.scrollTo(0, 0); });
  on('[data-song]', (e, ev) => { if (ev.target.closest('a')) return; const keep = isWide() && ST.tab === 'songs', y = scrollY, ly = ($('.spl') || {}).scrollTop; ST.sheet = { semi: 0, mode: null, big: ST.sheet.big, key: e.dataset.key || '' }; ST.view = { type: 'song', id: e.dataset.song }; render(); if (keep) { const l = $('.spl'); if (l) l.scrollTop = ly || 0; const r = $('.spr'); if (r) r.scrollTop = 0; } else window.scrollTo(0, 0); });
  $$('[data-song] a', m).forEach(a => a.addEventListener('click', ev => ev.stopPropagation()));
  on('[data-back]', () => { ST.view = null; render(); });
  on('[data-confirm]', async e => { await DB.updateAssign(e.dataset.confirm, { status: 'ok' }); toast('¡Listo! Confirmaste.'); await reload(); });
  on('[data-decline]', async e => { await DB.updateAssign(e.dataset.decline, { status: 'no' }); toast('Le avisamos al director para que busque reemplazo.'); await reload(); });
  on('[data-choose]', e => chooseSongs(e.dataset.choose));
  on('[data-editsvc]', e => editService(e.dataset.editsvc));
  on('[data-addteam]', e => addTeam(e.dataset.addteam));
  on('[data-chooses]', async e => { const [id, v] = e.dataset.chooses.split(':'); await DB.updateAssign(id, { chooses: v === '1' }); await reload(); });
  on('[data-unassign]', async e => { await DB.unassign(e.dataset.unassign); await reload(); });
  on('[data-delsvc]', async e => { if (!e.dataset.ok) { e.dataset.ok = 1; e.textContent = 'Toca otra vez para eliminar'; return; } await DB.deleteService(e.dataset.delsvc); ST.view = null; await reload(); });
  on('[data-editsong]', e => editSong(e.dataset.editsong));
  on('[data-member]', e => editMember(e.dataset.member));
  on('[data-prof]', e => { ST.view = { type: 'member', id: e.dataset.prof }; render(); window.scrollTo(0, 0); });
  on('[data-prog]', e => editProgram(e.dataset.prog));
  on('[data-viewphoto]', e => viewPhoto(e.dataset.viewphoto));
  $$('[data-photo]', m).forEach(inp => inp.onchange = async () => { const f = inp.files && inp.files[0]; if (!f) return; try { const photo = await photoData(f); const who = Object.assign({}, mem(inp.dataset.photo)); who.photo = photo; await DB.saveMember(who); toast('Foto actualizada.'); await reload(); } catch (x) { toast(x.message, 4000); } });
  on('[data-nophoto]', async e => { const who = Object.assign({}, mem(e.dataset.nophoto), { photo: '' }); await DB.saveMember(who); await reload(); });
  on('[data-export]', e => openExport(song(e.dataset.export)));
  on('[data-mode]', e => { ST.sheet.mode = e.dataset.mode; render(); });
  on('[data-semi]', e => { const d = +e.dataset.semi; ST.sheet.semi = d === 0 ? 0 : ((ST.sheet.semi + d + 18) % 12) - 6; render(); });
  on('[data-big]', () => { ST.sheet.big = !ST.sheet.big; render(); });
  on('[data-seg]', e => { ST.songSeg = e.dataset.seg; render(); });
  on('[data-tagf]', e => { const t = e.dataset.tagf; if (!t) ST.songTagF = []; else ST.songTagF = ST.songTagF.includes(t) ? ST.songTagF.filter(x => x !== t) : ST.songTagF.concat(t); render(); });
  const q = $('#songQ', m); if (q) q.oninput = e => { ST.songFilter = e.target.value; const p = e.target.selectionStart; render(); const n = $('#songQ'); n.focus(); n.setSelectionRange(p, p); };
  on('[data-lmode]', e => { ST.live = ST.live || { sid: upcoming()[0].id, i: 0, line: -1, sec: 0, beat: 3, play: false }; ST.live.mode = e.dataset.lmode; render(); });
  on('[data-livesong]', e => { const s = upcoming()[0]; ST.live = Object.assign(ST.live || {}, { sid: s.id, i: +e.dataset.livesong, line: -1, sec: 0, beat: 3 }); render(); });
  on('[data-livego]', () => { const s = upcoming()[0]; ST.live = ST.live && ST.live.sid === s.id ? ST.live : { sid: s.id, i: 0, line: -1, sec: 0, beat: 3 }; ST.live.play = !ST.live.play; clearInterval(liveT); if (ST.live.play) { const bpm = (song(s.songs[ST.live.i].song_id) || {}).bpm || 80; liveT = setInterval(liveStep, Math.max(250, 60000 / bpm)); } render(); });
  const la = $('#liveAddr', m); if (la) { const set = () => { const v = la.value.trim(); try { localStorage.setItem('rf-live-addr', v); } catch (e) {} $('#liveGo', m).href = v ? `http://${v.replace(/^https?:\/\//, '').replace(/:\d+$/, '')}:4747` : '#'; }; la.oninput = set; set(); }
  if (ST.live && ST.live.play) { const lines = $$('#liveChart .ln:not(.onlych)', m); lines.forEach((l, i) => l.classList.toggle('on', i === ST.live.line)); }
  on('[data-role]', e => e.classList.toggle('gold'));
  on('[data-theme-set]', e => setTheme(e.dataset.themeSet));
  on('[data-act]', async e => {
    const a = e.dataset.act;
    if (a === 'newsvc') editService(null);
    if (a === 'newsong') editSong(null, so => { ST.view = { type: 'song', id: so.id }; render(); });
    if (a === 'newmember') editMember(null);
    if (a === 'remind') toast(DB.mode === 'demo' ? 'En la versión real, ahora le llega el aviso por correo y notificación a quien falte por confirmar o elegir.' : 'Recordatorio enviado al equipo.', 4200);
    if (a === 'saveme') { const mm = Object.assign({}, me(), { name: $('#pName').value.trim(), phone: $('#pPhone').value.trim(), roles: $$('#pRoles .pill.gold').map(b => b.dataset.role) }); await DB.saveMember(mm); toast('Perfil guardado.'); await reload(); }
    if (a === 'setpw') { const v = $('#pPw').value; if (v.length < 8) { toast('Usa al menos 8 caracteres.'); return; } try { await DB.setPassword(v); $('#pPw').value = ''; try { localStorage.setItem('rf-login', 'pw'); } catch (_) {} toast('Contraseña guardada. La próxima vez entras con ella.'); } catch (x) { toast(x.message, 5000); } }
    if (a === 'push') enablePush();
    if (a === 'install' && installEvt) { installEvt.prompt(); const r = await installEvt.userChoice; installEvt = null; if (r.outcome !== 'accepted') render(); }
    if (a === 'reset') { DB.reset(); await reload(); toast('Volvieron los datos de ejemplo.'); }
    if (a === 'savecfg') { const url = $('#cfgUrl').value.trim(), key = $('#cfgKey').value.trim(); if (!/^https:\/\/.+\.supabase\.co/.test(url) || key.length < 30) { toast('Revisa la dirección (https://….supabase.co) y la clave pública.'); return; } try { localStorage.setItem('rf-cfg', JSON.stringify({ url, key })); } catch (_) {} location.reload(); }
    if (a === 'signout') { await DB.signOut(); location.reload(); }
  });
}
async function enablePush() {
  if (DB.mode === 'demo') { toast('En la versión instalada te pide permiso aquí y quedan activadas.', 3500); return; }
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { toast('Este navegador no recibe notificaciones. En iPhone, agrega primero la app a la pantalla de inicio.', 5000); return; }
    const reg = await navigator.serviceWorker.ready; const perm = await Notification.requestPermission(); if (perm !== 'granted') { toast('No diste permiso para notificaciones.'); return; }
    const k = (window.RF_CFG || {}).vapid; if (!k) { toast('Falta la clave de notificaciones en la configuración.'); return; }
    const raw = Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((k.length + 3) % 4)), c => c.charCodeAt(0));
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: raw }); await DB.savePush(sub.toJSON()); toast('Notificaciones activadas en este teléfono.');
  } catch (e) { toast('No se pudieron activar: ' + e.message, 5000); }
}

/* ---------- entrada (código por correo) ---------- */
function viewLogin(err) {
  let mode = (() => { try { return localStorage.getItem('rf-login') || 'code'; } catch (e) { return 'code'; } })(), sent = false;
  const root = document.getElementById('root');
  const draw = () => {
    root.innerHTML = `<div class="login"><div class="card lcard">
      <div class="lhead">${logo('lg')}<h1>RF App</h1><p class="hint">Rompiendo Fortalezas</p></div>
      <div class="seg stg"><button class="${mode === 'pw' ? 'on' : ''}" data-lm="pw">Contraseña</button><button class="${mode === 'code' ? 'on' : ''}" data-lm="code">Código por correo</button></div>
      <div class="field"><label for="lE">Correo</label><input class="in" id="lE" type="email" autocomplete="email" inputmode="email" value="${esc((() => { try { return localStorage.getItem('rf-email') || ''; } catch (e) { return ''; } })())}"></div>
      ${mode === 'pw' ? `<div class="field"><label for="lP">Contraseña</label><input class="in" id="lP" type="password" autocomplete="current-password"></div>
        <button class="btn primary" id="lGo">Entrar</button><p class="hint" style="margin:0;text-align:center">¿Primera vez o se te olvidó? Usa <a href="#" data-lm="code">código por correo</a>.</p>`
      : `<p class="hint" style="margin:0" id="lMsg">Te mandamos un código a tu correo. Lo escribes aquí y listo.</p>
        <div class="field" id="lCW"${sent ? '' : ' hidden'}><label for="lC">Código del correo</label><input class="in" id="lC" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="••••••" style="font-size:28px;letter-spacing:.35em;text-align:center"></div>
        <button class="btn primary" id="lGo">${sent ? 'Entrar' : 'Enviarme el código'}</button>`}
      ${err ? `<p class="hint" style="color:var(--bad);margin:0">${esc(err)}</p>` : ''}</div></div>`;
    $$('[data-lm]').forEach(b => b.onclick = ev => { ev.preventDefault(); mode = b.dataset.lm; err = ''; try { localStorage.setItem('rf-login', mode); } catch (e) {} draw(); });
    const em = () => { const e = $('#lE').value.trim().toLowerCase(); try { localStorage.setItem('rf-email', e); } catch (x) {} return e; };
    const go = $('#lGo');
    if (mode === 'pw') {
      const run = async () => { go.disabled = true; try { await DB.signInPw(em(), $('#lP').value); location.reload(); } catch (x) { err = x.message; draw(); } };
      go.onclick = run; $('#lP').onkeydown = e => { if (e.key === 'Enter') run(); };
    } else {
      const c = $('#lC');
      if (c) c.oninput = e => { const v = e.target.value.replace(/\D/g, ''); e.target.value = v; if (v.length >= 6 && !e.target.dataset.go) { e.target.dataset.go = 1; setTimeout(() => go.click(), 150); } };
      go.onclick = async () => { const e = em(); go.disabled = true;
        try { if (!sent) { await DB.sendCode(e); sent = true; err = ''; draw(); $('#lMsg').innerHTML = '<b>Revisa tu correo</b> (y la carpeta de spam). Te llegó un código de <b>app@rfortalezas.com</b>: pégalo aquí.'; $('#lC').focus(); }
          else { await DB.verify(e, $('#lC').value.trim()); location.reload(); } }
        catch (x) { err = /sending/i.test(x.message) ? 'No pudimos mandar el correo. Intenta de nuevo en un momento.' : /expired|invalid/i.test(x.message) ? 'Ese código no sirve o ya venció. Pide uno nuevo.' : x.message; if (c) c.dataset.go = ''; draw(); } };
    }
  };
  draw();
}

(async function start() {
  try { const t = localStorage.getItem('rf-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  let cfg = window.RF_CFG && window.RF_CFG.url ? window.RF_CFG : null; try { if (!cfg) cfg = JSON.parse(localStorage.getItem('rf-cfg') || 'null'); } catch (e) {}
  if (cfg && cfg.url && window.supabase) { DB = SupaDB(cfg); try { const ok = await DB.init(); if (!ok) { viewLogin(); return; } if (!DB.me()) { viewLogin('Ese correo no está en el equipo. Pídele al director que te invite.'); await DB.signOut(); return; } } catch (e) { viewLogin(e.message); return; } }
  else await DB.init();
  DB.onChange(() => reload());
  const h = (location.hash || '').slice(1); if (TABS.some(t => t[0] === h) || h === 'me') ST.tab = h; else if (h === 'mix' || h === 'live') { ST.tab = h; ST.stage = h; }
  await reload(); syncThemeColor(); if (ST.tab === 'mix') mixStart();
  try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) setTheme(''); }); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.RF_CFG && !isNativeApp()) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
